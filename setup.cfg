[flake8]
# Python 编码规范（基于 PEP8）
max-line-length = 120
extend-ignore =
    # E203: whitespace before ':' (与 black 兼容)
    E203,
    # W503: line break before binary operator (与 black 兼容)
    W503,
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv,
    env,
    node_modules,
    .serverless,
max-complexity = 18
# 函数/方法应有文档注释（覆盖 D100-D417 规则）
docstring-convention = google
per-file-ignores =
    __init__.py: F401

[isort]
# 导入排序规范
profile = black
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = src
default_section = THIRDPARTY
skip = .venv,venv,env,node_modules

[pylint]
# Pylint 代码检查
master.py-version = 3.10
master.jobs = 4
master.persistent = no
messages.disable =
    # 与 flake8 重复
    C0111,  # missing-docstring（由 flake8 D 规则覆盖）
    C0103,  # invalid-name（允许多种命名风格）
    W0511,  # fixme（允许 TODO/FIXME 注释）
    R0903,  # too-few-public-methods
    R0913,  # too-many-arguments
    R0914,  # too-many-locals
    R0915,  # too-many-statements
    R0801,  # duplicate-code（跨模块检查干扰大）
    R0901,  # too-many-ancestors
    R0902,  # too-many-instance-attributes
    R0911,  # too-many-return-statements
    R0912,  # too-many-branches
    E0401,  # unable to import（在函数计算环境中可能误报）
    C0415,  # import-outside-toplevel（延迟导入场景允许）
    W1203,  # logging-fstring（允许 f-string 日志）
    W0707,  # raise-missing-from
    R1705,  # no-else-return
reports.output-format = colorized
string.check-quote-consistency = yes
imports.allow-any-import-level = 4

[mypy]
# 类型检查配置
python_version = 3.10
strict = false
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
exclude =
    .venv/,
    venv/,
    env/,
    node_modules/,
    .serverless/,

[coverage:run]
source = src
branch = true
omit =
    */tests/*
    */test/*
    */setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
